<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<style>
body{background:#0c0f14;color:white;text-align:center;font-family:Arial;padding:50px;}
input{padding:12px;margin:10px;width:250px;}
button{padding:12px;background:#22c55e;border:none;color:white;cursor:pointer;}
</style>
</head>

<body>

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<script>
async function login(){
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let res = await fetch("/api/auth/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({email,password})
    });

    let data = await res.json();

    if(data.token){
        localStorage.setItem("adminToken", data.token);
        window.location.href = "admin.html";
    }else{
        alert("Invalid login");
    }
}
</script>

</body>
</html>
